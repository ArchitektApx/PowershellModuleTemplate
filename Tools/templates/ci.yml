name: CI

on:
  push:
    branches: ['**']   # branch pushes only; tags are handled by release.yml (which calls this)
  pull_request:
  workflow_call:       # invoked by release.yml so a release is gated on CI passing
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Generated by Tools/prepare.ps1 from the '{{PlatformName}}' platform preset:
        # {{PlatformDescription}}
        # Edit freely - nothing regenerates it. Keep it in sync with the target profiles in
        # Tools/PSScriptAnalyzer.psd1 and CompatiblePSEditions in the module manifest.
        include:
{{Matrix}}
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          path: ${{ matrix.modulePath }}
          key: psmodules-${{ matrix.os }}-${{ matrix.host }}-${{ hashFiles('Tools/install_dev_requirements.ps1', 'module.psd1') }}

      - name: Install dev requirements
        shell: pwsh
        run: ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File ./tasks.ps1 -Task install_dev_requirements

      - name: Lint
        shell: pwsh
        run: ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File ./tasks.ps1 -Task lint

      - name: Build
        shell: pwsh
        run: ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File ./tasks.ps1 -Task build

      - name: Test
        shell: pwsh
        run: ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File ./tasks.ps1 -Task test
